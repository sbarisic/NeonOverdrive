<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Neon Overdrive</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #060817;
        color: #ebf0fa;
        font:
          16px system-ui,
          sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100dvh;
      }
      #canvas {
        width: 100vw;
        height: 100dvh;
        flex: none;
        display: block;
        outline: none;
        touch-action: none;
      }
      body.arena-fullscreen #canvas {
        width: 100vw;
        height: 100dvh;
      }
      #status {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          radial-gradient(ellipse at 26% 40%, #123a494d, transparent 48%),
          radial-gradient(ellipse at 80% 65%, #36245245, transparent 50%), #060a16;
      }
      #status::before {
        content: '';
        position: absolute;
        inset: 0;
        opacity: 0.18;
        background-image:
          linear-gradient(#3d728430 1px, transparent 1px),
          linear-gradient(90deg, #3d728430 1px, transparent 1px);
        background-size: 72px 72px;
        mask-image: radial-gradient(ellipse, black, transparent 75%);
        pointer-events: none;
      }
      #status[hidden],
      #status [hidden] {
        display: none;
      }
      .launch-card {
        position: relative;
        box-sizing: border-box;
        width: min(900px, 90vw);
        padding: 42px;
        border: 1px solid #b397555c;
        border-top-color: #edcc7a;
        background: linear-gradient(120deg, #121d2cef, #0b101eeb);
        box-shadow:
          0 24px 100px #0008,
          inset 0 1px #fff05;
      }
      .launch-heading {
        margin: 0 0 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #9ab5c7;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .launch-heading span:first-child {
        color: #edcc7a;
      }
      .launch-content {
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr);
        gap: 34px;
        align-items: center;
      }
      .launch-art {
        width: 250px;
        height: 250px;
        color: #41f5eb;
        filter: drop-shadow(0 0 20px #41f5eb18);
      }
      .launch-orbit {
        transform-origin: 150px 150px;
        animation: orbit 32s linear infinite;
      }
      .launch-engine {
        animation: engine 2s ease-in-out infinite alternate;
      }
      .launch-title {
        margin: 0 0 22px;
        font-size: clamp(30px, 3.5vw, 44px);
        font-weight: 650;
        letter-spacing: 0.12em;
        line-height: 1.12;
      }
      .launch-title span {
        display: block;
        color: #edcc7a;
        font-weight: 350;
      }
      .launch-phase {
        margin: 0 0 7px;
        font-size: 16px;
        font-weight: 500;
        color: #e4f3fc;
      }
      .launch-detail {
        margin: 0;
        min-height: 36px;
        font-size: 13px;
        color: #92a8bb;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      .launch-progress-row {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin: 22px 0 9px;
        color: #7695aa;
        font:
          11px ui-monospace,
          monospace;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      [data-loading-count] {
        color: #41f5eb;
      }
      .launch-progress {
        height: 4px;
        background: #233645;
        overflow: hidden;
      }
      .launch-progress > span {
        display: block;
        width: 28%;
        height: 100%;
        background: #41f5eb;
        box-shadow: 0 0 14px #41f5eb99;
      }
      .launch-progress:not([aria-valuenow]) > span {
        animation: scan 1.8s ease-in-out infinite;
      }
      .launch-steps {
        display: flex;
        gap: 30px;
        padding: 24px 0 0;
        margin: 28px 0 0;
        border-top: 1px solid #7393a429;
        list-style: none;
        color: #647f93;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .launch-steps b {
        margin-right: 8px;
        font-weight: 400;
      }
      .launch-steps [data-state='active'] {
        color: #edcc7a;
      }
      .launch-steps [data-state='done'] {
        color: #41f5eb;
      }
      .launch-tip {
        position: relative;
        margin: 22px 0 0;
        color: #7e95a9;
        text-align: center;
        font-size: 12px;
        letter-spacing: 0.025em;
      }
      .launch-tip strong {
        color: #c8d7e1;
        font-weight: 500;
      }
      .launch-retry {
        margin-top: 18px;
        padding: 10px 20px;
        border: 1px solid #d4b86f;
        background: #3c3425;
        color: #f4da91;
        font: inherit;
        cursor: pointer;
      }
      .launch-retry:hover {
        background: #52462d;
      }
      .launch-retry:focus-visible {
        outline: 2px solid #41f5eb;
        outline-offset: 4px;
      }
      #status[data-failed] .launch-phase {
        color: #ffb3a8;
      }
      #status[data-failed] .launch-detail {
        max-height: 110px;
        overflow: auto;
      }
      #status[data-failed] .launch-art * {
        animation: none;
      }
      @keyframes orbit {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes engine {
        to {
          opacity: 0.45;
        }
      }
      @keyframes scan {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(460%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #status * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="1920" height="1080" tabindex="0"></canvas>
    <div id="status" data-phase="0">
      <div>
        <section class="launch-card" aria-labelledby="launch-title">
          <div class="launch-heading">
            <span>Flight console</span><span>Multiplayer / Online sector</span>
          </div>
          <div class="launch-content">
            <svg class="launch-art" viewBox="0 0 300 300" fill="none" aria-hidden="true">
              <circle cx="150" cy="150" r="120" stroke="#365266" stroke-width="1" />
              <circle cx="150" cy="150" r="92" stroke="#294553" stroke-dasharray="2 9" />
              <path d="M150 15v25M150 260v25M15 150h25M260 150h25" stroke="#738992" />
              <g class="launch-orbit">
                <path d="M30 150a120 120 0 0 1 120-120" stroke="#41f5eb" stroke-width="2" />
                <circle cx="150" cy="30" r="4" fill="#edcc7a" />
              </g>
              <g transform="rotate(28 150 150)">
                <path
                  d="M150 62 169 104 174 182 150 205 126 182 131 104Z"
                  fill="#163b48"
                  stroke="#7aede7"
                  stroke-width="2"
                />
                <path
                  d="M131 124 105 151 100 191 126 177M169 124 195 151 200 191 174 177"
                  fill="#1c2f43"
                  stroke="#4ba8b6"
                  stroke-width="2"
                />
                <path d="M138 111 150 84 162 111 159 134H141Z" fill="#41f5eb" opacity=".85" />
                <path d="M135 148h30v29h-30Z" fill="#294c58" stroke="#6aafb9" />
                <path d="M145 149v27M155 149v27" stroke="#edcc7a" />
                <path d="M134 190h32v13h-32Z" fill="#0d1f2d" stroke="#6aafb9" />
                <g class="launch-engine">
                  <path d="M138 207 150 246 162 207Z" fill="#41f5eb" opacity=".22" />
                  <path d="M144 205 150 229 156 205Z" fill="#95fff4" />
                </g>
              </g>
              <path d="M43 239h37M220 61h37" stroke="#edcc7a" opacity=".65" />
            </svg>
            <div>
              <h1 id="launch-title" class="launch-title">NEON <span>OVERDRIVE</span></h1>
              <div role="status" aria-live="polite" aria-atomic="true">
                <h2 class="launch-phase" data-loading-title>Establishing flight systems</h2>
                <p class="launch-detail" data-loading-detail>
                  Loading the game. Your next run begins shortly.
                </p>
              </div>
              <div class="launch-progress-row">
                <span data-loading-label>Resource loading</span
                ><span data-loading-count>In progress</span>
              </div>
              <div
                class="launch-progress"
                role="progressbar"
                aria-label="Loading flight systems"
                aria-valuemin="0"
                aria-valuemax="100"
              >
                <span data-loading-fill></span>
              </div>
              <button class="launch-retry" data-loading-retry hidden>Retry launch</button>
            </div>
          </div>
          <ol class="launch-steps" aria-label="Launch stages">
            <li data-loading-step data-state="active" aria-current="step">
              <b>01</b>Load resources
            </li>
            <li data-loading-step><b>02</b>Start systems</li>
            <li data-loading-step><b>03</b>Pilot console</li>
          </ol>
        </section>
        <p class="launch-tip">
          Your hull turns. Your momentum stays. <strong>Hold X to brake.</strong>
        </p>
        <noscript><p class="launch-tip">Enable JavaScript to launch Neon Overdrive.</p></noscript>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
