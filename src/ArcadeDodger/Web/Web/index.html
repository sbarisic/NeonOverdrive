<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arcade Dodger — NEON OVERDRIVE</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060817;color:#ebf0fa;font:16px system-ui,sans-serif}
    body{display:flex;align-items:center;justify-content:center;height:100dvh}
    #canvas{width:min(100vw,177.77777778dvh);height:min(56.25vw,100dvh);flex:none;display:block;outline:none;touch-action:none}
    body.arena-fullscreen #canvas{width:100vw;height:100dvh}
    #status{position:fixed;inset:1rem 1rem auto;color:#41f5eb;text-align:center;background:#060817;padding:.5rem;pointer-events:none}
    #status[hidden]{display:none}
  </style>
</head>
<body>
  <canvas id="canvas" width="1920" height="1080" tabindex="0"></canvas>
  <div id="status">Loading Arcade Dodger…</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
